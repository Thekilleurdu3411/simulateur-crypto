name: Données des cryptos minables

on:
  schedule:
    - cron: '17 * * * *'   # toutes les heures
  workflow_dispatch:

permissions:
  contents: write

jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/maj-altcoins.mjs
      - name: Enregistrer si les données ont changé
        run: |
          git config user.name "maj-donnees"
          git config user.email "actions@users.noreply.github.com"
          git add data/altcoins.json
          git diff --cached --quiet || (git commit -m "Données des cryptos minables" && git push)
